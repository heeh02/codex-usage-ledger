[package]
name = "codex-usage-ledger"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust core for a standalone replay-safe macOS Codex usage app"
repository = "https://github.com/heeh02/codex-usage-ledger"

[lib]
name = "codex_usage_ledger"
path = "src/lib.rs"

[[bin]]
name = "codex-usage-ledger"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.13"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
