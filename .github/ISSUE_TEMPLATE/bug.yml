name: Bug report
description: Report a reproducible problem using synthetic or redacted evidence.
title: "[Bug]: "
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach auth files, raw Codex databases, rollout logs, prompt text,
        account identifiers, private paths, or screenshots containing project names.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Rust core, Storage, Ingest and replay, HTTP API, Web dashboard, macOS app, Documentation and release]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the problem without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include a small synthetic fixture or steps when possible.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: App version, macOS version, architecture, and collection mode. Do not include usernames or paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, private paths, prompts, databases, logs, and private project names.
          required: true
