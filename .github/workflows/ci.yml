name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: scripts/check-public-privacy.sh
      - run: scripts/check-public-history.sh
      - run: scripts/check-doc-links.sh
      - run: scripts/check-version-consistency.sh
      - run: scripts/check-generated-files.sh
      - run: scripts/check-module-boundaries.sh
      - run: node scripts/check-workflow-security.mjs

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:e2e

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: scripts/check-api-contract.sh
      - run: scripts/generate-sbom.sh .ci-artifacts/sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-inventories
          path: |
            .ci-artifacts/sbom/rust.cdx.json
            .ci-artifacts/sbom/web.cdx.json
            .ci-artifacts/sbom/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  macos-app:
    name: macOS application
    needs: [repository-policy, rust, web, supply-chain]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash macos/test-pure.sh
      - run: bash macos/build-app.sh
      - name: Verify application bundle output
        run: |
          test -d "dist/Codex Usage Ledger.app"
          test -x "dist/Codex Usage Ledger.app/Contents/MacOS/CodexUsageLedger"
          test -x "dist/Codex Usage Ledger.app/Contents/Resources/bin/codex-usage-ledger"
          codesign --verify --deep --strict "dist/Codex Usage Ledger.app"
